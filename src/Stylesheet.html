<style>
  :root {
    /* Ace Septic & Excavation brand palette (Northbound Studio, Feb 2025) */
    --black: #050706;
    --green: #2E3D35;
    --green-dark: #1a231e;
    --green-light: #e7e9e6;
    --orange: #FF4900;
    --orange-dark: #cc3a00;
    --stone: #BDB5AB;
    --light-gray: #EAE6E4;
    --off-white: #F7F6F5;

    --bg: var(--off-white);
    --surface: #ffffff;
    --ink: var(--black);
    --muted: #767970;
    --border: var(--light-gray);
    --primary: var(--green);
    --primary-dark: var(--green-dark);
    --primary-light: var(--green-light);
    --accent: var(--orange);
    --accent-dark: var(--orange-dark);
    --danger: #a3271b;
    --danger-light: #fbeceb;
    --warn: #8a5a2e;
    --warn-light: #f4ede3;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow-sm: 0 1px 2px rgba(5, 7, 6, 0.06);
    --shadow-md: 0 6px 20px rgba(5, 7, 6, 0.10);
    --shadow-lg: 0 16px 40px rgba(5, 7, 6, 0.18);
    --sidebar-w: 220px;
    --bottomnav-h: 64px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .mark svg { display: block; }

  /* ---------- App shell ---------- */

  .app-shell { display: flex; min-height: 100vh; }

  /* Desktop/tablet sidebar */
  .sidebar {
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    background: linear-gradient(180deg, var(--green), var(--green-dark));
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 22px; }
  .sidebar .brand .mark { width: 30px; flex-shrink: 0; }
  .sidebar .brand .mark svg { width: 30px; height: auto; }
  .sidebar .brand-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .sidebar .brand-sub { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 1px; }

  .side-nav { display: flex; flex-direction: column; gap: 3px; }

  .nav-btn {
    display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
    background: transparent; border: none; color: rgba(255,255,255,0.75);
    padding: 10px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
    cursor: pointer; font-family: inherit; transition: background 0.15s, color 0.15s;
  }
  .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-btn:hover:not(.active) { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-btn.active { background: #fff; color: var(--green-dark); font-weight: 600; box-shadow: var(--shadow-sm); }

  .sidebar-footer { margin-top: auto; padding: 10px 6px 0; font-size: 10.5px; color: rgba(255,255,255,0.45); }

  /* Mobile top bar (shown only under the breakpoint) */
  .mobile-topbar {
    display: none;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: #fff;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: var(--shadow-md);
  }
  .mobile-topbar .mark { width: 24px; flex-shrink: 0; }
  .mobile-topbar .mark svg { width: 24px; height: auto; }
  .mobile-topbar .brand-name { font-size: 14.5px; font-weight: 700; }

  /* Mobile bottom nav */
  .bottom-nav {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(5,7,6,0.08);
    z-index: 30;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bottom-nav-inner { display: flex; }
  .bottom-nav .nav-btn {
    flex: 1; flex-direction: column; gap: 3px; color: var(--muted); border-radius: 0;
    padding: 9px 4px 8px; font-size: 10.5px; font-weight: 600;
  }
  .bottom-nav .nav-btn.active { background: transparent; color: var(--orange); box-shadow: none; }
  .bottom-nav .nav-btn svg { width: 21px; height: 21px; }

  .main-area { flex: 1; min-width: 0; }

  main { padding: 24px; max-width: 1440px; margin: 0 auto; }

  .view { display: none; }
  .view.active { display: block; }

  @media (max-width: 880px) {
    .sidebar { display: none; }
    .mobile-topbar { display: flex; }
    .bottom-nav { display: block; }
    .main-area { padding-bottom: var(--bottomnav-h); }
    main { padding: 14px; }
  }

  /* ---------- Board ---------- */

  .board {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 16px;
    -webkit-overflow-scrolling: touch;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 250px;
    flex: 0 0 250px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  @media (max-width: 880px) {
    .column { min-width: 82vw; flex: 0 0 82vw; }
  }

  .column-accent { height: 4px; width: 100%; }

  .column-header {
    padding: 13px 14px 11px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .column-header .stage-name {
    font-weight: 600;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--ink);
  }

  .column-header .count-pill {
    background: var(--bg);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    min-width: 22px;
    text-align: center;
  }

  .column-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 90px;
    max-height: calc(100vh - 230px);
    overflow-y: auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    cursor: pointer;
    font-size: 12.5px;
    transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s;
  }

  .card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .card .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

  .card .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px;
    background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px;
  }

  .card .name { font-weight: 600; font-size: 13px; line-height: 1.2; }
  .card .phone { color: var(--muted); font-size: 12px; margin-top: 1px; }

  .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; gap: 6px; }

  .card .badge {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    background: var(--primary-light); color: var(--primary-dark); white-space: nowrap;
  }

  .card .days-tag { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card .days-tag.days-warn { color: var(--warn); font-weight: 600; }

  .empty-state {
    color: var(--muted); font-size: 12.5px; padding: 26px 10px; text-align: center; line-height: 1.5;
  }
  .empty-state .empty-icon { font-size: 20px; display: block; margin-bottom: 6px; opacity: 0.5; }

  /* ---------- Buttons ---------- */

  button.primary {
    background: var(--accent); color: #fff; border: none; padding: 10px 18px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; font-weight: 600;
    font-family: inherit; transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-dark); }

  button.secondary {
    background: #fff; color: var(--ink); border: 1px solid var(--border); padding: 9px 15px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }
  button.secondary:hover { border-color: var(--primary); background: var(--primary-light); }

  button.danger, button.warn {
    color: #fff; border: none; padding: 9px 16px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; font-family: inherit; font-weight: 600; transition: opacity 0.15s;
  }
  button.danger { background: var(--danger); }
  button.warn { background: var(--warn); }
  button.danger:hover, button.warn:hover { opacity: 0.88; }

  /* ---------- Forms ---------- */

  form .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 5px; }
  form label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  form input, form select, form textarea {
    padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13.5px; font-family: inherit; color: var(--ink); background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
  }
  form input:focus, form select:focus, form textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);
  }
  form textarea { min-height: 76px; resize: vertical; }

  .card-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 24px; max-width: 640px; box-shadow: var(--shadow-sm);
  }
  .card-panel h2 { margin-top: 0; font-size: 17px; }

  /* ---------- Modals ---------- */

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(5,7,6,0.5); backdrop-filter: blur(1px);
    align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; z-index: 50;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: #fff; border-radius: var(--radius); padding: 22px; width: 100%; max-width: 560px;
    box-shadow: var(--shadow-lg); animation: modal-in 0.15s ease-out;
  }
  @keyframes modal-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .close-x {
    background: var(--bg); border: none; font-size: 16px; cursor: pointer; color: var(--muted);
    width: 28px; height: 28px; border-radius: 50%; line-height: 1;
  }
  .close-x:hover { background: var(--border); color: var(--ink); }

  #detail-body > div:not(.stage-row):not(.field):not(.actions-row):not(.activity-log) {
    padding: 3px 0; font-size: 13.5px;
  }

  .stage-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .stage-row button {
    font-size: 11.5px; font-weight: 500; padding: 6px 11px; border-radius: 20px;
    border: 1px solid var(--border); background: #fff; cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .stage-row button:hover { border-color: var(--primary); }
  .stage-row button.current { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

  .actions-row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

  .activity-log { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; max-height: 220px; overflow-y: auto; }
  .activity-item { font-size: 12px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .activity-item .type { font-weight: 600; color: var(--primary-dark); }
  .activity-item .ts { color: var(--muted); float: right; }

  /* ---------- Reports ---------- */

  table.report-table {
    width: 100%; border-collapse: collapse; margin-bottom: 26px; background: #fff;
    border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-sm);
  }
  table.report-table th, table.report-table td { border-bottom: 1px solid var(--border); padding: 9px 12px; font-size: 12.5px; text-align: left; }
  table.report-table th { background: var(--bg); font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.3px; }
  table.report-table tr:last-child td { border-bottom: none; }
  table.report-table tbody tr:hover { background: var(--bg); }

  .reports-scroll { overflow-x: auto; }

  .section-title { font-size: 14px; font-weight: 700; margin: 24px 0 10px; color: var(--ink); }
  .section-title:first-child { margin-top: 0; }

  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: #fff; padding: 11px 18px;
    border-radius: var(--radius-sm); font-size: 13px; opacity: 0; transform: translateY(8px); transition: all 0.2s;
    z-index: 100; box-shadow: var(--shadow-lg);
  }
  @media (max-width: 880px) {
    .toast { bottom: calc(var(--bottomnav-h) + 14px); left: 16px; right: 16px; }
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--danger); }

  /* ---------- Field Log ---------- */

  .fl-list-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .fl-list-header h2 { margin: 0; font-size: 17px; }

  .fl-entry-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 13px 14px; margin-bottom: 10px; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s;
  }
  .fl-entry-card:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
  .fl-entry-card .fl-entry-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .fl-entry-card .fl-entry-customer { font-weight: 600; font-size: 13.5px; }
  .fl-entry-card .fl-entry-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .fl-status-pill {
    font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .fl-status-pill.complete { background: var(--primary-light); color: var(--primary-dark); }
  .fl-status-pill.in-progress { background: var(--warn-light); color: var(--warn); }

  .accordion-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    margin-bottom: 10px; overflow: hidden;
  }
  .accordion-header {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: var(--bg); border: none; padding: 13px 14px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .accordion-header .chev { transition: transform 0.15s; color: var(--muted); }
  .accordion-section.open .accordion-header .chev { transform: rotate(180deg); }
  .accordion-body { display: none; padding: 14px; }
  .accordion-section.open .accordion-body { display: block; }

  .checkbox-row {
    display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 10px 2px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .checkbox-row:last-child { border-bottom: none; }
  .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }

  .fl-save-bar {
    position: sticky; bottom: 0; background: linear-gradient(var(--bg-transparent, rgba(246,247,245,0)), var(--bg) 30%);
    padding: 16px 0 4px; margin-top: 4px;
  }
  @media (max-width: 880px) {
    .fl-save-bar { position: fixed; left: 0; right: 0; bottom: var(--bottomnav-h); padding: 10px 14px; background: var(--bg); border-top: 1px solid var(--border); }
    .fl-save-bar button { width: 100%; }
    #fl-form-view form { padding-bottom: 70px; }
  }
</style>
