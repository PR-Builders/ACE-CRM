<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --ink: #1c231d;
    --muted: #767f74;
    --border: #e4e7e0;
    --primary: #2f6f4f;
    --primary-dark: #1e4a34;
    --primary-light: #e8f2ec;
    --accent: #b45309;
    --danger: #b3261e;
    --danger-light: #fbeceb;
    --warn: #92400e;
    --warn-light: #fdf1e3;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow-sm: 0 1px 2px rgba(20, 30, 20, 0.06);
    --shadow-md: 0 6px 20px rgba(20, 30, 20, 0.10);
    --shadow-lg: 0 16px 40px rgba(20, 30, 20, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */

  header.app-header {
    background: linear-gradient(135deg, var(--primary-dark), #163a29);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: var(--shadow-md);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand-mark {
    width: 36px; height: 36px; border-radius: 9px;
    background: rgba(255,255,255,0.14);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; letter-spacing: -0.5px;
    border: 1px solid rgba(255,255,255,0.18);
  }

  header.app-header h1 { font-size: 16.5px; margin: 0; font-weight: 600; letter-spacing: 0.1px; }
  header.app-header .brand-sub { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 1px; }

  nav.tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.15); padding: 4px; border-radius: 10px; }

  nav.tabs button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.75);
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }

  nav.tabs button:hover:not(.active) { background: rgba(255,255,255,0.08); color: #fff; }
  nav.tabs button.active { background: #fff; color: var(--primary-dark); font-weight: 600; box-shadow: var(--shadow-sm); }

  main { padding: 24px; max-width: 1440px; margin: 0 auto; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Board ---------- */

  .board {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 16px;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 250px;
    flex: 0 0 250px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .column-accent { height: 4px; width: 100%; }

  .column-header {
    padding: 13px 14px 11px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .column-header .stage-name {
    font-weight: 600;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--ink);
  }

  .column-header .count-pill {
    background: var(--bg);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    min-width: 22px;
    text-align: center;
  }

  .column-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 90px;
    max-height: calc(100vh - 230px);
    overflow-y: auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    cursor: pointer;
    font-size: 12.5px;
    transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s;
  }

  .card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .card .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

  .card .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px;
    background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px;
  }

  .card .name { font-weight: 600; font-size: 13px; line-height: 1.2; }
  .card .phone { color: var(--muted); font-size: 12px; margin-top: 1px; }

  .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; gap: 6px; }

  .card .badge {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    background: var(--primary-light); color: var(--primary-dark); white-space: nowrap;
  }

  .card .days-tag { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card .days-tag.days-warn { color: var(--warn); font-weight: 600; }

  .empty-state {
    color: var(--muted); font-size: 12.5px; padding: 26px 10px; text-align: center; line-height: 1.5;
  }
  .empty-state .empty-icon { font-size: 20px; display: block; margin-bottom: 6px; opacity: 0.5; }

  /* ---------- Buttons ---------- */

  button.primary {
    background: var(--primary); color: #fff; border: none; padding: 10px 18px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; font-weight: 600;
    font-family: inherit; transition: background 0.15s;
  }
  button.primary:hover { background: var(--primary-dark); }

  button.secondary {
    background: #fff; color: var(--ink); border: 1px solid var(--border); padding: 9px 15px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }
  button.secondary:hover { border-color: var(--primary); background: var(--primary-light); }

  button.danger, button.warn {
    color: #fff; border: none; padding: 9px 16px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; font-family: inherit; font-weight: 600; transition: opacity 0.15s;
  }
  button.danger { background: var(--danger); }
  button.warn { background: var(--warn); }
  button.danger:hover, button.warn:hover { opacity: 0.88; }

  /* ---------- Forms ---------- */

  form .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 5px; }
  form label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  form input, form select, form textarea {
    padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13.5px; font-family: inherit; color: var(--ink); background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  form input:focus, form select:focus, form textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);
  }
  form textarea { min-height: 76px; resize: vertical; }

  .card-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 24px; max-width: 640px; box-shadow: var(--shadow-sm);
  }
  .card-panel h2 { margin-top: 0; font-size: 17px; }

  /* ---------- Modals ---------- */

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(20,25,20,0.5); backdrop-filter: blur(1px);
    align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; z-index: 50;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: #fff; border-radius: var(--radius); padding: 22px; width: 100%; max-width: 560px;
    box-shadow: var(--shadow-lg); animation: modal-in 0.15s ease-out;
  }
  @keyframes modal-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .close-x {
    background: var(--bg); border: none; font-size: 16px; cursor: pointer; color: var(--muted);
    width: 28px; height: 28px; border-radius: 50%; line-height: 1;
  }
  .close-x:hover { background: var(--border); color: var(--ink); }

  #detail-body > div:not(.stage-row):not(.field):not(.actions-row):not(.activity-log) {
    padding: 3px 0; font-size: 13.5px;
  }

  .stage-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .stage-row button {
    font-size: 11.5px; font-weight: 500; padding: 6px 11px; border-radius: 20px;
    border: 1px solid var(--border); background: #fff; cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .stage-row button:hover { border-color: var(--primary); }
  .stage-row button.current { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

  .actions-row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

  .activity-log { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; max-height: 220px; overflow-y: auto; }
  .activity-item { font-size: 12px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .activity-item .type { font-weight: 600; color: var(--primary-dark); }
  .activity-item .ts { color: var(--muted); float: right; }

  /* ---------- Reports ---------- */

  table.report-table {
    width: 100%; border-collapse: collapse; margin-bottom: 26px; background: #fff;
    border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-sm);
  }
  table.report-table th, table.report-table td { border-bottom: 1px solid var(--border); padding: 9px 12px; font-size: 12.5px; text-align: left; }
  table.report-table th { background: var(--bg); font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.3px; }
  table.report-table tr:last-child td { border-bottom: none; }
  table.report-table tbody tr:hover { background: var(--bg); }

  .section-title { font-size: 14px; font-weight: 700; margin: 24px 0 10px; color: var(--ink); }
  .section-title:first-child { margin-top: 0; }

  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: #fff; padding: 11px 18px;
    border-radius: var(--radius-sm); font-size: 13px; opacity: 0; transform: translateY(8px); transition: all 0.2s;
    z-index: 100; box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--danger); }

  @media (max-width: 640px) {
    header.app-header { flex-direction: column; align-items: flex-start; }
    main { padding: 14px; }
  }
</style>
