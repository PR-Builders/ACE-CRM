<style>

    --bg: #f4f5f7;

    --muted: #6b7280;
    --border: #e2e5ea;
    --primary: #2f6f4f;
    --primary-dark: #234f38;
    --accent: #b45309;
    --danger: #b3261e;
    --warn: #92400e;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  header.app-header {
    background: var(--primary-dark);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  header.app-header h1 { font-size: 18px; margin: 0; font-weight: 600; }

  nav.tabs { display: flex; gap: 6px; }

  nav.tabs button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 7px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
  }

  nav.tabs button.active { background: #fff; color: var(--primary-dark); font-weight: 600; }

  main { padding: 18px; max-width: 1400px; margin: 0 auto; }

  .view { display: none; }
  .view.active { display: block; }

  .board {

    gap: 12px;
    overflow-x: auto;
    padding-bottom: 12px;
  }

    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 230px;
    flex: 0 0 230px;
    display: flex;
    flex-direction: column;
  }

  .column-header {
    padding: 10px 12px;
    font-weight: 600;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }

  .column-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }

  .card {

    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;

    font-size: 12.5px;

  .card:hover { border-color: var(--primary); }

  button.danger { background: var(--danger); color: #fff; border: none; padding: 8px 14px; border-radius: var(--radius); cursor: pointer; }
  button.warn { background: var(--warn); color: #fff; border: none; padding: 8px 14px; border-radius: var(--radius); cursor: pointer; }

  form .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }

  .card-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; max-width: 640px; }

  .modal {

  }

  }
  .stage-row button.current { background: var(--primary); color: #fff; border-color: var(--primary); }

  .actions-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  .activity-item .type { font-weight: 600; color: var(--primary-dark); }

  table.report-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; background: #fff; }
  table.report-table th, table.report-table td { border: 1px solid var(--border); padding: 7px 10px; font-size: 12.5px; text-align: left; }
  table.report-table th { background: var(--bg); font-weight: 600; }

  .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 8px; }
  .empty-state { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }

  @media (max-width: 600px) {
    header.app-header { flex-direction: column; align-items: flex-start; }
  }
</style>
