<script>
(function () {
  'use strict';

  var currentDetailLeadId = null;

  // Brand-consistent progression: Stone -> Green (brand) -> Orange (brand) as a lead advances.
  var STAGE_COLORS = {
    'Leads': '#BDB5AB', 'Site Visit': '#99978E', 'Estimating': '#767970',
    'Engineering': '#525B53', 'Proposal': '#2E3D35', 'Contract': '#624028',
    'Review': '#97431B', 'Follow Up': '#CB460D', 'Close Out': '#FF4900'
  };

  function initials(name) {
    if (!name) return '?';
    var parts = String(name).trim().split(/\s+/);
    return ((parts[0][0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  }

  /** Wires an event listener only if the element actually exists, so one
   *  missing/renamed element (e.g. a partial deploy) can't throw and halt
   *  the rest of this script — including the initial loadPipeline() call
   *  at the bottom, which would otherwise leave the whole board blank. */
  function on(id, event, handler) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(event, handler);
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { switchView(btn.dataset.view); });
  });

  function switchView(view) {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.view === view); });
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + view); });
    if (view === 'pipeline') loadPipeline();
    if (view === 'reports') loadReports();
    if (view === 'field-log') loadFieldLog();
  }

  function showToast(message, isError) {
    var t = document.getElementById('toast');
    t.textContent = message;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(function () { t.className = 'toast'; }, 3200);
  }

  function fmtMoney(v) {
    if (!v && v !== 0) return '';
    return '$' + Number(v).toLocaleString();
  }
  function fmtDate(v) {
    if (!v) return '';
    var d = new Date(v);
    return isNaN(d) ? String(v) : d.toLocaleDateString();
  }

  // ---------- Pipeline ----------

  function loadPipeline() {
    google.script.run.withSuccessHandler(renderBoard).withFailureHandler(onError).getPipelineData();
  }

  function renderBoard(board) {
    var el = document.getElementById('board');
    el.innerHTML = '';
    STAGES.forEach(function (stage) {
      var cards = board[stage] || [];
      var col = document.createElement('div');
      col.className = 'column' + (cards.length ? '' : ' collapsed');
      col.innerHTML =
        '<div class="column-accent" style="background:' + (STAGE_COLORS[stage] || '#94a3b8') + '"></div>' +
        '<div class="column-header"><span class="stage-name">' + escapeHtml(stage) + '</span>' +
        '<span class="count-pill">' + cards.length + '</span>' +
        '<svg class="chev mobile-only" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>' +
        '<div class="column-body"></div>';
      col.querySelector('.column-header').addEventListener('click', function () {
        col.classList.toggle('collapsed');
      });
      var body = col.querySelector('.column-body');
      if (!cards.length) {
        body.innerHTML = '<div class="empty-state"><span class="empty-icon">&#9679;</span>No leads in this stage</div>';
      }
      cards.forEach(function (card) {
        var div = document.createElement('div');
        div.className = 'card';
        div.innerHTML =
          '<div class="card-top">' +
            '<div class="avatar">' + escapeHtml(initials(card.Name)) + '</div>' +
            '<div><div class="name">' + escapeHtml(card.Name || '(no name)') + '</div>' +
            '<div class="phone">' + escapeHtml(card.Phone || '') + '</div></div>' +
          '</div>' +
          '<div class="meta"><span class="badge">' + escapeHtml(card.Source || '') + '</span>' +
          '<span class="days-tag' + (card.daysInStage > 7 ? ' days-warn' : '') + '">' + card.daysInStage + 'd in stage</span></div>';
        div.addEventListener('click', function () { openDetail(card['Lead ID']); });
        body.appendChild(div);
      });
      el.appendChild(col);
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- Lead detail ----------

  function openDetail(leadId) {
    if (!leadId) {
      showToast('That card is missing its Lead ID — try refreshing the pipeline.', true);
      return;
    }
    currentDetailLeadId = leadId;
    google.script.run.withSuccessHandler(renderDetail).withFailureHandler(onError).getLead(leadId);
  }

  function renderDetail(data) {
    if (!data || !data.lead) {
      showToast('Could not load that lead — please try again.', true);
      return;
    }
    var lead = data.lead;
    document.getElementById('detail-name').textContent = lead.Name || '(no name — placeholder call lead)';
    var body = document.getElementById('detail-body');

    var stageButtons = STAGES.map(function (s) {
      return '<button data-stage="' + s + '" class="' + (s === lead.Stage ? 'current' : '') + '">' + s + '</button>';
    }).join('');

    var smsConsentNote = lead['SMS Consent'] === 'Yes'
      ? '<span style="color:#2E3D35;">Yes</span>'
      : '<span style="color:#a3271b;">' + escapeHtml(lead['SMS Consent'] || 'Not Asked') + '</span> ' +
        '<button class="secondary" id="btn-verbal-consent" style="margin-left:6px;padding:3px 8px;font-size:11px;">Confirm verbal consent</button>';

    body.innerHTML =
      '<div><strong>Phone:</strong> ' + escapeHtml(lead.Phone || '') + ' &nbsp; <strong>Email:</strong> ' + escapeHtml(lead.Email || '') + '</div>' +
      '<div><strong>Address:</strong> ' + escapeHtml(lead.Address || '') + '</div>' +
      '<div><strong>Source:</strong> ' + escapeHtml(lead.Source || '') + (lead['Source Detail'] ? ' — ' + escapeHtml(lead['Source Detail']) : '') + '</div>' +
      '<div><strong>Status:</strong> ' + escapeHtml(lead.Status) + (lead['Lost Reason'] ? ' (' + escapeHtml(lead['Lost Reason']) + ')' : '') + '</div>' +
      '<div><strong>SMS Consent:</strong> ' + smsConsentNote + '</div>' +
      '<div class="stage-row">' + stageButtons + '</div>' +
      '<div class="field"><label>Estimated Value</label><input id="f-estimated" value="' + (lead['Estimated Value'] || '') + '"></div>' +
      '<div class="field"><label>Actual Value (set at Close Out)</label><input id="f-actual" value="' + (lead['Actual Value'] || '') + '"></div>' +
      '<div class="field"><label>Next Follow-Up Date</label><input type="date" id="f-followup" value="' + (lead['Next Follow-Up Date'] ? new Date(lead['Next Follow-Up Date']).toISOString().slice(0,10) : '') + '"></div>' +
      '<div class="field"><label>Add Note</label><textarea id="f-note" placeholder="Add a note..."></textarea></div>' +
      '<button class="secondary" id="btn-save-fields">Save</button>' +
      '<div class="actions-row">' +
        '<button class="warn" id="btn-not-qualified">Not Qualified</button>' +
        '<button class="danger" id="btn-spam">Spam</button>' +
      '</div>' +
      '<div class="activity-log">' + renderActivities(data.activities) + '</div>';

    body.querySelectorAll('.stage-row button').forEach(function (btn) {
      btn.addEventListener('click', function () { moveStage(leadId, btn.dataset.stage); });
    });
    on('btn-verbal-consent', 'click', function () { confirmVerbalConsent(leadId); });
    on('btn-save-fields', 'click', function () { saveFields(leadId); });
    on('btn-not-qualified', 'click', openNotQualifiedModal);
    on('btn-spam', 'click', function () { markSpam(leadId); });

    document.getElementById('detail-backdrop').classList.add('active');
  }

  function renderActivities(activities) {
    if (!activities.length) return '<div class="empty-state">No activity yet.</div>';
    return activities.map(function (a) {
      return '<div class="activity-item"><span class="type">' + escapeHtml(a.Type) + '</span>' +
        '<span class="ts">' + fmtDate(a.Timestamp) + '</span><div>' + escapeHtml(a.Detail || '') + '</div></div>';
    }).join('');
  }

  function moveStage(leadId, stage) {
    google.script.run.withSuccessHandler(function () {
      showToast('Moved to ' + stage);
      openDetail(leadId);
      loadPipeline();
    }).withFailureHandler(onError).updateLeadStage(leadId, stage, '');
  }

  function confirmVerbalConsent(leadId) {
    google.script.run.withSuccessHandler(function () {
      showToast('SMS consent recorded');
      openDetail(leadId);
    }).withFailureHandler(onError).setSmsConsentVerbal(leadId, '');
  }

  function saveFields(leadId) {
    var fields = {
      'Estimated Value': document.getElementById('f-estimated').value,
      'Actual Value': document.getElementById('f-actual').value,
      'Next Follow-Up Date': document.getElementById('f-followup').value
    };
    var note = document.getElementById('f-note').value.trim();
    if (note) fields.Notes = note;
    google.script.run.withSuccessHandler(function () {
      showToast('Saved');
      openDetail(leadId);
      loadPipeline();
    }).withFailureHandler(onError).updateLeadFields(leadId, fields, '');
  }

  function markSpam(leadId) {
    if (!confirm('Mark this lead as Spam?')) return;
    google.script.run.withSuccessHandler(function () {
      showToast('Marked as Spam');
      closeDetail();
      loadPipeline();
    }).withFailureHandler(onError).flagSpam(leadId, '');
  }

  function openNotQualifiedModal() {
    document.getElementById('nq-backdrop').classList.add('active');
  }
  on('nq-close', 'click', function () {
    document.getElementById('nq-backdrop').classList.remove('active');
  });
  on('nq-confirm', 'click', function () {
    var reason = document.getElementById('nq-reason').value;
    google.script.run.withSuccessHandler(function () {
      showToast('Marked Not Qualified');
      document.getElementById('nq-backdrop').classList.remove('active');
      closeDetail();
      loadPipeline();
    }).withFailureHandler(onError).flagNotQualified(currentDetailLeadId, reason, '');
  });

  on('detail-close', 'click', closeDetail);
  function closeDetail() { document.getElementById('detail-backdrop').classList.remove('active'); }

  // ---------- New Lead ----------

  on('new-lead-form', 'submit', function (e) {
    e.preventDefault();
    var form = e.target;
    var data = {};
    new FormData(form).forEach(function (value, key) { data[key] = value; });
    google.script.run.withSuccessHandler(function () {
      showToast('Lead created');
      form.reset();
      switchView('pipeline');
      document.querySelector('[data-view="pipeline"]').classList.add('active');
      document.querySelector('[data-view="new-lead"]').classList.remove('active');
    }).withFailureHandler(onError).createLead(data, false);
  });

  // ---------- Reports ----------

  function loadReports() {
    google.script.run.withSuccessHandler(renderReports).withFailureHandler(onError).getSourceReport();
  }

  function renderReports(report) {
    var el = document.getElementById('reports-container');
    el.innerHTML =
      '<div class="section-title">By Source</div>' + groupTable(report.bySource) +
      '<div class="section-title">By Campaign / Source Detail</div>' + groupTable(report.byCampaign) +
      '<div class="section-title">By UTM Source (platform)</div>' + groupTable(report.byUtmSource) +
      '<div class="section-title">Lost Reasons (Not Qualified)</div>' + countTable(report.lostReasons) +
      '<div class="section-title">Totals</div>' +
      '<p>Total leads: ' + report.totals.leadCount + ' &nbsp; Closed: ' + report.totals.closedCount +
      ' &nbsp; Total Actual Value: ' + fmtMoney(report.totals.totalActualValue) + '</p>';
  }

  function groupTable(groups) {
    var keys = Object.keys(groups);
    if (!keys.length) return '<div class="empty-state">No data yet.</div>';
    var rows = keys.map(function (key) {
      var g = groups[key];
      return '<tr><td>' + escapeHtml(key) + '</td><td>' + g.total + '</td><td>' + g.active + '</td><td>' + g.spam +
        '</td><td>' + g.notQualified + '</td><td>' + g.closeOutCount + '</td><td>' + g.conversionRate + '%</td>' +
        '<td>' + fmtMoney(g.totalActualValue) + '</td></tr>';
    }).join('');
    return '<table class="report-table"><thead><tr><th>Name</th><th>Total</th><th>Active</th><th>Spam</th>' +
      '<th>Not Qualified</th><th>Closed Out</th><th>Conv. Rate</th><th>Total Actual Value</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function countTable(counts) {
    var keys = Object.keys(counts);
    if (!keys.length) return '<div class="empty-state">No Not Qualified leads yet.</div>';
    var rows = keys.map(function (key) { return '<tr><td>' + escapeHtml(key) + '</td><td>' + counts[key] + '</td></tr>'; }).join('');
    return '<table class="report-table"><thead><tr><th>Reason</th><th>Count</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  // ---------- Field Log ----------

  var FL_FIELDS = [
    'customer', 'address', 'scopeOfWork', 'date', 'crew', 'county', 'soil', 'serviceType', 'status',
    'photoTaken', 'photoUploaded', 'gmb', 'ig',
    'vidHook', 'vidProblem', 'vidProcess', 'vidChallenge', 'vidResult',
    'eduTopic', 'eduPoints',
    'csProblem', 'csSolution', 'csTechnical', 'csChallenges', 'csEquipment', 'csLocal', 'csLinks'
  ];
  var FL_CHECKBOX_FIELDS = ['photoTaken', 'photoUploaded', 'gmb', 'ig'];

  document.querySelectorAll('#field-log-form .accordion-header').forEach(function (btn) {
    btn.addEventListener('click', function () {
      btn.closest('.accordion-section').classList.toggle('open');
    });
  });

  function newTicketId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'fl-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function loadFieldLog() {
    document.getElementById('fl-form-view').hidden = true;
    document.getElementById('fl-list-view').hidden = false;
    google.script.run.withSuccessHandler(renderFieldLogList).withFailureHandler(onError).getFieldLogEntries();
  }

  function renderFieldLogList(entries) {
    var el = document.getElementById('fl-entries-list');
    if (!entries.length) {
      el.innerHTML = '<div class="empty-state">No field log entries yet. Tap "New Entry" after a job to capture photos, video, and case study material.</div>';
      return;
    }
    el.innerHTML = entries.map(function (entry) {
      var statusClass = entry.status === 'Complete' ? 'complete' : 'in-progress';
      return '<div class="fl-entry-card" data-ticket="' + escapeHtml(entry.ticketId) + '">' +
        '<div class="fl-entry-top">' +
          '<span class="fl-entry-customer">' + escapeHtml(entry.customer || '(no customer name)') + '</span>' +
          '<span class="fl-status-pill ' + statusClass + '">' + escapeHtml(entry.status) + '</span>' +
        '</div>' +
        '<div class="fl-entry-meta">' + escapeHtml(entry.serviceType || '') +
          (entry.date ? ' &middot; ' + escapeHtml(entry.date) : '') +
          (entry.address ? ' &middot; ' + escapeHtml(entry.address) : '') + '</div>' +
      '</div>';
    }).join('');
    el.querySelectorAll('.fl-entry-card').forEach(function (card) {
      card.addEventListener('click', function () {
        var entry = entries.filter(function (e) { return e.ticketId === card.dataset.ticket; })[0];
        openFieldLogEntry(entry);
      });
    });
  }

  function resetFieldLogForm() {
    var form = document.getElementById('field-log-form');
    form.reset();
    document.getElementById('fl-date').value = new Date().toISOString().slice(0, 10);
    document.getElementById('fl-status').value = 'In Progress';
    document.querySelectorAll('#field-log-form .accordion-section').forEach(function (s, i) {
      s.classList.toggle('open', i === 0);
    });
  }

  function openFieldLogEntry(entry) {
    resetFieldLogForm();
    document.getElementById('fl-ticketId').value = entry.ticketId;
    document.getElementById('fl-form-title').textContent = entry.customer || 'Job Entry';
    FL_FIELDS.forEach(function (key) {
      var input = document.getElementById('fl-' + key);
      if (!input) return;
      if (FL_CHECKBOX_FIELDS.indexOf(key) !== -1) input.checked = !!entry[key];
      else input.value = entry[key] || '';
    });
    showFieldLogForm();
  }

  function showFieldLogForm() {
    document.getElementById('fl-list-view').hidden = true;
    document.getElementById('fl-form-view').hidden = false;
  }

  on('fl-new-entry-btn', 'click', function () {
    resetFieldLogForm();
    document.getElementById('fl-ticketId').value = newTicketId();
    document.getElementById('fl-form-title').textContent = 'New Job Entry';
    showFieldLogForm();
  });

  on('fl-back-btn', 'click', loadFieldLog);

  on('field-log-form', 'submit', function (e) {
    e.preventDefault();
    var entry = { ticketId: document.getElementById('fl-ticketId').value };
    FL_FIELDS.forEach(function (key) {
      var input = document.getElementById('fl-' + key);
      if (!input) return;
      entry[key] = FL_CHECKBOX_FIELDS.indexOf(key) !== -1 ? input.checked : input.value;
    });
    google.script.run.withSuccessHandler(function () {
      showToast('Entry saved');
      loadFieldLog();
    }).withFailureHandler(onError).saveFieldLogEntry(entry);
  });

  function onError(err) {
    showToast(err.message || String(err), true);
  }

  loadPipeline();
})();
</script>
